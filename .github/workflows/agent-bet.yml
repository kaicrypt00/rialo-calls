name: RialoBot - Daily Bets

on:
  schedule:
    # 8:00 AM UTC every day
    - cron: '0 8 * * *'
  # Manual trigger: GitHub repo → Actions tab → "RialoBot - Daily Bets" → "Run workflow"
  workflow_dispatch:

jobs:
  place-bets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'agent/package.json'

      - name: Install agent dependencies
        run: npm install
        working-directory: agent

      - name: Run RialoBot betting agent
        run: node agent.js
        working-directory: agent
        env:
          AGENT_PRIVATE_KEY:         ${{ secrets.AGENT_PRIVATE_KEY }}
          LATCH_TOKEN:               ${{ secrets.LATCH_TOKEN }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}