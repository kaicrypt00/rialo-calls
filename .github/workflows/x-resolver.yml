name: X Resolver

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes (UTC) — rialo-calls is a public repo
  workflow_dispatch:          # Manual run button in GitHub Actions UI for testing

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15     # 2 attempts × 5min gap + processing headroom

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run X Resolver
        run: node agents/x-resolver.js
        env:
          RESOLVER_ADMIN_KEY: ${{ secrets.RESOLVER_ADMIN_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
